name: PHPUnit Test Runner.
description: Run PHPUnit tests with coverage and configurable options.

inputs:
  additional-args:
    description: Additional PHPUnit arguments.
    default: "--log-junit junit.xml"
    required: false
    type: string
  configuration:
    description: PHPUnit configuration file.
    default: ""
    required: false
    type: string
  coverage-driver:
    description: Code coverage driver to use (pcov, xdebug, none).
    default: none
    required: false
    type: string
  coverage-file:
    description: Coverage output file name.
    default: coverage.xml
    required: false
    type: string
  coverage-format:
    description: Coverage report format (clover, html, xml).
    default: clover
    required: false
    type: string
  coverage-token:
    description: Codecov token for uploading coverage.
    default: ""
    required: false
    type: string
  debug:
    description: Display warnings in phpunit.
    default: ""
    required: false
    type: string
  exclude-group:
    description: Groups to exclude, separated by commas or spaces.
    default: ""
    required: false
    type: string
  group:
    description: Groups to include, separated by commas or spaces.
    default: ""
    required: false
    type: string
  path:
    description: Path to PHPUnit executable.
    default: vendor/bin/phpunit
    required: false
    type: string
  test-suite:
    description: Specific test suite to run.
    default: ""
    required: false
    type: string

runs:
  using: composite
  steps:
    - name: Run PHPUnit tests on Linux.
      shell: bash
      if: runner.os != 'Windows'
      env:
        ADDITIONAL_ARGS: ${{ inputs.additional-args }}
        CONFIGURATION: ${{ inputs.configuration }}
        COVERAGE_DRIVER: ${{ inputs.coverage-driver }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        COVERAGE_FORMAT: ${{ inputs.coverage-format }}
        DEBUG: ${{ inputs.debug }}
        EXCLUDE_GROUP: ${{ inputs.exclude-group }}
        GROUP: ${{ inputs.group }}
        PHPUNIT_PATH: ${{ inputs.path }}
        TEST_SUITE: ${{ inputs.test-suite }}
      run: |
        args=(--colors=always)

        add_param() {
          if [ -n "$2" ]; then
            args+=("$1" "$2")
          fi
        }

        # PHPUnit < 11 keeps only the last repeated --group/--exclude-group, PHPUnit 12 rejects comma-separated lists.
        phpunit_major=0

        if [ -n "$GROUP" ] || [ -n "$EXCLUDE_GROUP" ]; then
          if [[ "$("$PHPUNIT_PATH" --version 2>/dev/null)" =~ PHPUnit\ ([0-9]+)\. ]]; then
            phpunit_major="${BASH_REMATCH[1]}"
          else
            echo "::warning::Unable to detect the PHPUnit version; passing groups as a comma-separated list."
          fi
        fi

        add_groups() {
          local groups=()

          read -r -a groups <<< "${2//,/ }"

          if [ "${#groups[@]}" -eq 0 ]; then
            return
          fi

          if [ "$phpunit_major" -ge 11 ]; then
            for group in "${groups[@]}"; do
              args+=("$1" "$group")
            done
          else
            args+=("$1" "$(IFS=,; echo "${groups[*]}")")
          fi
        }

        if [ -n "$COVERAGE_DRIVER" ] && [ "$COVERAGE_DRIVER" != "none" ]; then
          args+=("--coverage-$COVERAGE_FORMAT=$COVERAGE_FILE")
        fi

        add_param "--configuration" "$CONFIGURATION"
        add_param "--testsuite" "$TEST_SUITE"
        add_groups "--group" "$GROUP"
        add_groups "--exclude-group" "$EXCLUDE_GROUP"

        if [ -n "$DEBUG" ]; then
          read -r -a debug_args <<< "$DEBUG"
          args+=("${debug_args[@]}")
        fi

        if [ -n "$ADDITIONAL_ARGS" ]; then
          read -r -a extra_args <<< "$ADDITIONAL_ARGS"
          args+=("${extra_args[@]}")
        fi

        printf 'PHPUnit command:'
        printf ' %q' "$PHPUNIT_PATH" "${args[@]}"
        printf '\n'

        "$PHPUNIT_PATH" "${args[@]}"

    - name: Run PHPUnit tests on Windows.
      shell: pwsh
      if: runner.os == 'Windows'
      env:
        ADDITIONAL_ARGS: ${{ inputs.additional-args }}
        CONFIGURATION: ${{ inputs.configuration }}
        COVERAGE_DRIVER: ${{ inputs.coverage-driver }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        COVERAGE_FORMAT: ${{ inputs.coverage-format }}
        DEBUG: ${{ inputs.debug }}
        EXCLUDE_GROUP: ${{ inputs.exclude-group }}
        GROUP: ${{ inputs.group }}
        PHPUNIT_PATH: ${{ inputs.path }}
        TEST_SUITE: ${{ inputs.test-suite }}
      run: |
        $arguments = @('--colors=always')

        function Add-Param([string] $name, [string] $value) {
          if ($value) {
            $script:arguments += @($name, $value)
          }
        }

        # PHPUnit < 11 keeps only the last repeated --group/--exclude-group, PHPUnit 12 rejects comma-separated lists.
        $phpunitMajor = 0

        if ($env:GROUP -or $env:EXCLUDE_GROUP) {
          $version = & $env:PHPUNIT_PATH --version 2>$null | Out-String

          if ($version -match 'PHPUnit (\d+)\.') {
            $phpunitMajor = [int] $Matches[1]
          } else {
            Write-Host '::warning::Unable to detect the PHPUnit version; passing groups as a comma-separated list.'
          }
        }

        function Add-Groups([string] $name, [string] $value) {
          $groups = @($value -split '[\s,]+' | Where-Object { $_ })

          if ($groups.Count -eq 0) {
            return
          }

          if ($script:phpunitMajor -ge 11) {
            foreach ($group in $groups) {
              $script:arguments += @($name, $group)
            }
          } else {
            $script:arguments += @($name, ($groups -join ','))
          }
        }

        if ($env:COVERAGE_DRIVER -and $env:COVERAGE_DRIVER -ne 'none') {
          $arguments += "--coverage-$($env:COVERAGE_FORMAT)=$($env:COVERAGE_FILE)"
        }

        Add-Param '--configuration' $env:CONFIGURATION
        Add-Param '--testsuite' $env:TEST_SUITE
        Add-Groups '--group' $env:GROUP
        Add-Groups '--exclude-group' $env:EXCLUDE_GROUP

        if ($env:DEBUG) {
          $arguments += $env:DEBUG -split ' '
        }

        if ($env:ADDITIONAL_ARGS) {
          $arguments += $env:ADDITIONAL_ARGS -split ' '
        }

        Write-Host "PHPUnit command: $env:PHPUNIT_PATH $($arguments -join ' ')"

        & $env:PHPUNIT_PATH @arguments

    - name: Upload test results to Codecov.
      if: ${{ !cancelled() && inputs.coverage-driver != 'none' }}
      uses: codecov/test-results-action@47f89e9acb64b76debcd5ea40642d25a4adced9f # v1.1.1
      with:
        token: ${{ inputs.coverage-token }}

    - name: Upload coverage to Codecov.
      if: ${{ !cancelled() && inputs.coverage-driver != 'none' }}
      uses: codecov/codecov-action@af09b5e394c93991b95a5e7646aeb90c1917f78f # v5.5.1
      with:
        token: ${{ inputs.coverage-token }}
        files: ./${{ inputs.coverage-file }}
